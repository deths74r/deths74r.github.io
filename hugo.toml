# ─────────────────────────────────────────────────────────────────────────────
# Site configuration
# Custom domain — Pages serves edwardjedmonds.com (CNAME lives in static/CNAME).
# ─────────────────────────────────────────────────────────────────────────────
baseURL = "https://edwardjedmonds.com/"
locale = "en-us"
# Interpret date-only publication entries in the site’s editorial timezone.
timeZone = "America/Chicago"
title = "Edward J. Edmonds"
enableRobotsTXT = true
enableGitInfo = false
# Emit an author-friendly "last modified" from front matter if present
enableEmoji = false

[pagination]
  pagerSize = 12

[params]
  description = "Essays by Edward J. Edmonds on adaptive systems, physiology, essential fatty acids, and the ways biological and social systems maintain their structure."
  author = "Edward J. Edmonds"
  author_bio = "Writer drawing on more than twenty years in histotechnology to examine evidence, physiology, and adaptive systems."
  tagline = "Adaptive systems · Essential fatty acid biochemistry · Hormetic endocrinology"
  # Concise phrase for the homepage <title> and social card (keep it short for search results).
  seo_tagline = "Adaptive Systems & Physiology"
  # Contact address, split so no contiguous "user@domain" sits in the source.
  # Rendered obfuscated by the `email` shortcode. Update both parts to change it.
  email_user = "edward.edmonds"
  email_domain = "gmail.com"
  # Buttondown newsletter. `enabled` gates the nav/homepage/footer Subscribe CTAs.
  [params.newsletter]
    enabled = true
    url = "https://buttondown.com/edwardjedmonds"
    blurb = "Research notes and long-form investigations, delivered by email."

# ── Navigation ───────────────────────────────────────────────────────────────
[menu]
  [[menu.main]]
    name = "Essays"
    pageRef = "/essays"
    weight = 10
  [[menu.main]]
    name = "About"
    pageRef = "/about"
    weight = 40
  [[menu.main]]
    name = "Contact"
    pageRef = "/contact"
    weight = 50
  [[menu.main]]
    name = "Search"
    pageRef = "/search"
    weight = 60

# ── Content taxonomies (topic clustering for SEO) ────────────────────────────
[taxonomies]
  tag = "tags"

# ── Markdown rendering ───────────────────────────────────────────────────────
[markup]
  [markup.goldmark.renderer]
    # Single trusted author; allow raw HTML in Markdown for figures/tables.
    unsafe = true
  [markup.goldmark.parser]
    [markup.goldmark.parser.attribute]
      block = true
      title = true
  # LaTeX math via passthrough delimiters (rendered by KaTeX on pages with `math: true`)
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)']]
  [markup.highlight]
    style = "github"
    noClasses = true
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

# ── Output formats: HTML + RSS everywhere ────────────────────────────────────
[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[services]
  [services.rss]
    limit = 30

[sitemap]
  changefreq = "monthly"
  priority = 0.6
