<a class="skip-link" href="#content">Skip to content</a>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="site-title" href="{{ "/" | relURL }}">{{ site.Title }}</a>
    <nav class="site-nav" aria-label="Primary">
      <ul>
        {{- range site.Menus.main }}
        <li><a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ else if $.HasMenuCurrent "main" . }} aria-current="true"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
        {{- if site.Params.newsletter.enabled }}
        <li><a class="nav-cta" href="{{ site.Params.newsletter.url }}">Subscribe</a></li>
        {{- end }}
      </ul>
    </nav>
  </div>
</header>
